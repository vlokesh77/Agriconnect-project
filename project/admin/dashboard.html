<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet"
          href="../style.css">

</head>

<body>


<header class="navbar">

    <div class="logo">
        🌾 AgriFriend Admin
    </div>

    <nav>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="manage-crops.html">
            Crops
        </a>

        <a href="manage-users.html">
            Users
        </a>

        <a href="#" onclick="logout()">
            Logout
        </a>

    </nav>

</header>


<div class="dashboard-container">

    <div class="dashboard-header">

        <h1>
            Admin Dashboard 👨‍💼
        </h1>

    </div>


    <div class="dashboard-grid">


        <div class="dashboard-card">

            <h3>
                👨‍🌾 Farmers
            </h3>

            <div
                class="number"
                id="userCount">

                0

            </div>

            <a
                href="manage-users.html"
                class="btn">

                View Users

            </a>

        </div>


        <div class="dashboard-card">

            <h3>
                🌱 Crops
            </h3>

            <div
                class="number"
                id="cropCount">

                0

            </div>

            <a
                href="manage-crops.html"
                class="btn">

                Manage Crops

            </a>

        </div>


        <div class="dashboard-card">

            <h3>
                💰 Prices
            </h3>

            <div class="number">
                4
            </div>

            <p>
                Price records
            </p>

        </div>


        <div class="dashboard-card">

            <h3>
                📋 Schemes
            </h3>

            <div class="number">
                4
            </div>

            <p>
                Scheme records
            </p>

        </div>

    </div>

</div>


<script src="../app.js"></script>


<script>

checkAdmin();


const users =
    JSON.parse(
        localStorage.getItem(
            "users"
        )
    ) || [];


const farmers =
    users.filter(
        user =>
            user.role === "farmer"
    );


const crops =
    JSON.parse(
        localStorage.getItem(
            "crops"
        )
    ) || [];


document.getElementById(
    "userCount"
).innerText =
    farmers.length;


document.getElementById(
    "cropCount"
).innerText =
    crops.length;

</script>

</body>

</html>
