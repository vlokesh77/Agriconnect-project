<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - AgriFriend</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        🌾 AgriFriend
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="signup.html">
            Signup
        </a>

    </nav>

</header>


<div class="auth-container">

    <div class="auth-box">

        <h2>🔐 Login</h2>


        <form id="loginForm">

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn form-btn">

                Login

            </button>

        </form>


        <p id="loginMessage"
           class="message">
        </p>


        <div style="
            margin-top:25px;
            padding:15px;
            background:#f1f8e9;
            border-radius:8px;
        ">

            <strong>Demo Admin Account</strong>

            <br><br>

            Email:
            admin@gmail.com

            <br>

            Password:
            admin123

        </div>


        <p style="text-align:center; margin-top:20px;">

            Don't have an account?

            <a href="signup.html">
                Signup
            </a>

        </p>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
