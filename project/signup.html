<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Farmer Signup</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        🌾 AgriFriend
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>


<div class="auth-container">

    <div class="auth-box">

        <h2>🌱 Farmer Signup</h2>


        <form id="signupForm">

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn form-btn">

                Create Account

            </button>

        </form>


        <p id="message" class="message"></p>


        <p style="text-align:center; margin-top:20px;">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
