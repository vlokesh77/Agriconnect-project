<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Farmer Profile</title>

    <link rel="stylesheet"
          href="../style.css">

</head>

<body>


<header class="navbar">

    <div class="logo">
        🌾 AgriFriend
    </div>

    <nav>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="crops.html">
            Crops
        </a>

        <a href="prices.html">
            Prices
        </a>

        <a href="#" onclick="logout()">
            Logout
        </a>

    </nav>

</header>


<div class="auth-container">

    <div class="auth-box">

        <h2>
            👨‍🌾 My Profile
        </h2>


        <div class="form-group">

            <label>
                Name
            </label>

            <input
                type="text"
                id="profileName"
                readonly
            >

        </div>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                id="profileEmail"
                readonly
            >

        </div>


        <div class="form-group">

            <label>
                Phone
            </label>

            <input
                type="text"
                id="profilePhone"
                readonly
            >

        </div>


        <div class="form-group">

            <label>
                Role
            </label>

            <input
                type="text"
                id="profileRole"
                readonly
            >

        </div>

    </div>

</div>


<script src="../app.js"></script>


<script>

checkFarmer();


const user =
    getLoggedInUser();


document.getElementById(
    "profileName"
).value =
    user.name;


document.getElementById(
    "profileEmail"
).value =
    user.email;


document.getElementById(
    "profilePhone"
).value =
    user.phone;


document.getElementById(
    "profileRole"
).value =
    user.role;

</script>

</body>
</html>
