<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Agricultural Schemes</title>

    <link rel="stylesheet"
          href="../style.css">

</head>

<body>


<header class="navbar">

    <div class="logo">
        🌾 AgriFriend
    </div>

    <nav>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="crops.html">
            Crops
        </a>

        <a href="prices.html">
            Prices
        </a>

        <a href="tips.html">
            Tips
        </a>

        <a href="#" onclick="logout()">
            Logout
        </a>

    </nav>

</header>


<div class="dashboard-container">

    <h1>
        📋 Agricultural Schemes
    </h1>

    <br>


    <div
        class="content-grid"
        id="schemeContainer">
    </div>

</div>


<script src="../app.js"></script>


<script>

checkFarmer();


const schemes =
    JSON.parse(
        localStorage.getItem(
            "schemes"
        )
    ) || [];


const container =
    document.getElementById(
        "schemeContainer"
    );


schemes.forEach(
    function(scheme) {

        container.innerHTML += `

            <div class="content-card">

                <h3>
                    📋 ${scheme.title}
                </h3>

                <p>
                    ${scheme.description}
                </p>

            </div>

        `;

    }
);

</script>

</body>
</html>
