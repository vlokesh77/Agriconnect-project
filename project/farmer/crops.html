<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Crop Information</title>

    <link rel="stylesheet"
          href="../style.css">

</head>

<body>


<header class="navbar">

    <div class="logo">
        🌾 AgriFriend
    </div>

    <nav>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="crops.html">
            Crops
        </a>

        <a href="prices.html">
            Prices
        </a>

        <a href="tips.html">
            Tips
        </a>

        <a href="#" onclick="logout()">
            Logout
        </a>

    </nav>

</header>


<div class="dashboard-container">

    <h1>
        🌱 Crop Information
    </h1>

    <br>


    <div
        class="content-grid"
        id="cropContainer">
    </div>

</div>


<script src="../app.js"></script>


<script>

checkFarmer();


const crops =
    JSON.parse(
        localStorage.getItem(
            "crops"
        )
    ) || [];


const container =
    document.getElementById(
        "cropContainer"
    );


crops.forEach(
    function(crop) {

        container.innerHTML += `

            <div class="content-card">

                <h3>
                    🌱 ${crop.name}
                </h3>

                <p>
                    <strong>
                        Season:
                    </strong>

                    ${crop.season}
                </p>

                <p>
                    <strong>
                        Soil:
                    </strong>

                    ${crop.soil}
                </p>

                <p>
                    ${crop.description}
                </p>

            </div>

        `;

    }
);

</script>

</body>
</html>
